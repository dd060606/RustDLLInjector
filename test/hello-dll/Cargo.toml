[package]
name = "hello-dll"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "hello_dll"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
